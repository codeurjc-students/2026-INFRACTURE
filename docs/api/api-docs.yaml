components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
    SaveScenarioDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ScenarioDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        revision:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConnectionDTO:
      type: object
      properties:
        sourceKey:
          type: string
          format: uuid
        port:
          type: string
        targetKey:
          type: string
          format: uuid
      required:
      - port
      - sourceKey
      - targetKey
    PositionDTO:
      type: object
      properties:
        x:
          type: number
          format: double
        "y":
          type: number
          format: double
    SaveComponentDTO:
      type: object
      properties:
        key:
          type: string
          format: uuid
        templateKey:
          type: string
        name:
          type: string
        position:
          $ref: "#/components/schemas/PositionDTO"
        profile:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
      required:
      - key
      - parameters
      - position
    SaveScenarioGraphDTO:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        components:
          type: array
          items:
            $ref: "#/components/schemas/SaveComponentDTO"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionDTO"
        workload:
          $ref: "#/components/schemas/WorkloadDTO"
      required:
      - components
      - connections
      - revision
    WorkloadDTO:
      type: object
      properties:
        targetKey:
          type: string
          format: uuid
        profile:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
        seed:
          type: integer
          format: int32
      required:
      - parameters
      - seed
    ComponentDTO:
      type: object
      properties:
        key:
          type: string
          format: uuid
        templateKey:
          type: string
        type:
          type: string
          enum:
          - HTTP_SERVICE
          - WORKER
          - POSTGRESQL
          - REDIS
          - RABBITMQ
        name:
          type: string
        position:
          $ref: "#/components/schemas/PositionDTO"
        profile:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
    ScenarioGraphDTO:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentDTO"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionDTO"
        workload:
          $ref: "#/components/schemas/WorkloadDTO"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssueDTO"
    TargetDTO:
      type: object
      properties:
        kind:
          type: string
          enum:
          - COMPONENT
          - CONNECTION
          - WORKLOAD
          - SCENARIO
        key:
          type: string
    ValidationIssueDTO:
      type: object
      properties:
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
        code:
          type: string
        message:
          type: string
        target:
          $ref: "#/components/schemas/TargetDTO"
        field:
          type: string
    SaveProjectDTO:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ProjectDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterUserDTO:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        password:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        active:
          type: boolean
        avatarKey:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunExecutionDTO:
      type: object
      properties:
        revision:
          type: integer
          format: int32
      required:
      - revision
    ExecutedComponentDTO:
      type: object
      properties:
        key:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - HTTP_SERVICE
          - WORKER
          - POSTGRESQL
          - REDIS
          - RABBITMQ
        status:
          type: string
          enum:
          - STARTING
          - HEALTHY
          - UNHEALTHY
          - EXITED
        response:
          type: string
    ExecutedWorkloadDTO:
      type: object
      properties:
        targetKey:
          type: string
          format: uuid
        profile:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
        seed:
          type: integer
          format: int32
        summaryCollectedAt:
          type: string
          format: date-time
        completed:
          type: boolean
        summary:
          $ref: "#/components/schemas/LoadSummaryDTO"
    ExecutionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scenarioId:
          type: integer
          format: int64
        scenarioRevision:
          type: integer
          format: int32
        phase:
          type: string
          enum:
          - RESERVED
          - STARTING
          - RUNNING
          - STOPPING
          - RELEASED
        stopCause:
          type: string
          enum:
          - STOP_REQUESTED
          - FAILURE
          - INTERRUPTION
        outcome:
          type: string
          enum:
          - COMPLETED
          - FAILED
          - INTERRUPTED
        failureReason:
          type: string
        cleanupFailures:
          type: integer
          format: int32
        cleanupError:
          type: string
        cleanupRetryNeeded:
          type: boolean
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: "#/components/schemas/ExecutedComponentDTO"
        workload:
          $ref: "#/components/schemas/ExecutedWorkloadDTO"
        plan:
          type: object
          additionalProperties: {}
    LoadSummaryDTO:
      type: object
      properties:
        requests:
          type: integer
          format: int64
        failedRequests:
          type: integer
          format: int64
        droppedIterations:
          type: integer
          format: int64
        averageLatencyMs:
          type: number
          format: double
        p95LatencyMs:
          type: number
          format: double
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    ParameterDTO:
      type: object
      properties:
        name:
          type: string
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
    WorkloadProfileDTO:
      type: object
      properties:
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDTO"
        seed:
          $ref: "#/components/schemas/ParameterDTO"
        requires:
          type: array
          items:
            type: string
            enum:
            - HTTP
            - RESOURCE_READ
            - RESOURCE_WRITE
            - TASK_CREATE
            - SQL_DATABASE
            - KEY_VALUE
            - MESSAGE_BROKER
        initialParameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelProjectDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PagedModelScenarioDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    ComponentConfigurationDTO:
      type: object
      properties:
        profile:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: integer
            format: int32
    ComponentTemplateDTO:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - HTTP_SERVICE
          - WORKER
          - POSTGRESQL
          - REDIS
          - RABBITMQ
        contract:
          $ref: "#/components/schemas/TemplateContractDTO"
        initialConfiguration:
          $ref: "#/components/schemas/ComponentConfigurationDTO"
    PagedModelComponentTemplateDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ComponentTemplateDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    PortDTO:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        accepts:
          type: array
          items:
            type: string
            enum:
            - HTTP
            - RESOURCE_READ
            - RESOURCE_WRITE
            - TASK_CREATE
            - SQL_DATABASE
            - KEY_VALUE
            - MESSAGE_BROKER
        min:
          type: integer
          format: int32
        max:
          type: integer
          format: int32
    ProfileDTO:
      type: object
      properties:
        name:
          type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterDTO"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortDTO"
        capabilities:
          type: array
          items:
            type: string
            enum:
            - HTTP
            - RESOURCE_READ
            - RESOURCE_WRITE
            - TASK_CREATE
            - SQL_DATABASE
            - KEY_VALUE
            - MESSAGE_BROKER
    TemplateContractDTO:
      type: object
      properties:
        version:
          type: integer
          format: int32
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileDTO"
