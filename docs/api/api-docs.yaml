openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/component-templates:
    get:
      tags:
      - component-template-controller
      operationId: getComponentTemplates
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - HTTP_SERVICE
          - WORKER
          - LOAD_GENERATOR
          - POSTGRESQL
          - REDIS
          - RABBITMQ
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelComponentTemplateDTO"
components:
  schemas:
    ComponentTemplateDTO:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - HTTP_SERVICE
          - WORKER
          - LOAD_GENERATOR
          - POSTGRESQL
          - REDIS
          - RABBITMQ
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelComponentTemplateDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ComponentTemplateDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
