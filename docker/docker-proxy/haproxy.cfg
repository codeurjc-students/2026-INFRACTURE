# Docker API proxy for the Infracture backend
# Only the calls that `docker compose up --wait`, `ps`, `down -v` and the label cleanup need pass through.
# Everything else, such as exec, build, archive, swarm or secrets, receives 403.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlog-normal
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend docker
    bind :2375
    # The CLI prefixes paths with the API version, e.g. /v1.51/containers/json.
    http-request set-var(txn.api) path,regsub(^/v[0-9.]+/,/)

    acl engine            var(txn.api) -m reg ^/_ping$|^/version$
    acl containers        var(txn.api) -m reg ^/containers/json$|^/containers/[^/]+/json$
    acl container_create  var(txn.api) -m reg ^/containers/create$|^/containers/[^/]+/(start|stop|kill)$
    acl container         var(txn.api) -m reg ^/containers/[^/]+$
    acl networks          var(txn.api) -m reg ^/networks$|^/networks/[^/]+$
    acl network_change    var(txn.api) -m reg ^/networks/create$|^/networks/[^/]+/(connect|disconnect)$
    acl network           var(txn.api) -m reg ^/networks/[^/]+$
    acl volumes           var(txn.api) -m reg ^/volumes$|^/volumes/[^/]+$
    acl volume_create     var(txn.api) -m reg ^/volumes/create$
    acl volume            var(txn.api) -m reg ^/volumes/[^/]+$
    acl image             var(txn.api) -m reg ^/images/.+/json$
    acl image_pull        var(txn.api) -m reg ^/images/create$

    http-request allow if { method GET HEAD } engine
    http-request allow if { method GET } containers or { method GET } networks or { method GET } volumes or { method GET } image
    http-request allow if { method POST } container_create or { method POST } network_change or { method POST } volume_create or { method POST } image_pull
    http-request allow if { method DELETE } container or { method DELETE } network or { method DELETE } volume
    http-request deny deny_status 403
    default_backend engine

backend engine
    server docker /var/run/docker.sock
