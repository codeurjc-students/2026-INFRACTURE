name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "[Bug] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Provide the smallest reproducible case and remove sensitive data from logs or screenshots.

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: List the exact actions needed to reproduce the problem.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what happens instead, including any error message.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the relevant application version, operating system, browser or runtime.
      placeholder: |
        - Commit or version:
        - Operating system:
        - Browser or runtime:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots or other information that helps diagnose the problem.
      placeholder: Drag files here or paste sanitized output.
    validations:
      required: false
