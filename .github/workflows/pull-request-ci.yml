name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend full tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend test suite
        run: ./mvnw verify

      - name: Upload backend failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend full tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Controlled branch protection verification
        run: exit 1

      - name: Build
        run: npm run build

      - name: Upload frontend failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-failure-reports
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  client-server:
    name: Client-server integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run client-server integration test
        run: |
          set -o pipefail
          mkdir -p .ci-artifacts
          ./scripts/test-client-server-integration.sh 2>&1 \
            | tee .ci-artifacts/client-server.log

      - name: Upload client-server failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-server-failure-log
          path: .ci-artifacts/client-server.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser system tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser system tests
        working-directory: frontend
        run: npm run test:system

      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
