spring.application.name=infracture-backend
spring.config.import=optional:file:../.env[.properties]

infracture.admin.username=${INFRACTURE_ADMIN_USERNAME:}
infracture.admin.email=${INFRACTURE_ADMIN_EMAIL:}
infracture.admin.display-name=${INFRACTURE_ADMIN_DISPLAY_NAME:}
infracture.admin.password=${INFRACTURE_ADMIN_PASSWORD:}

# How long an experiment runs after all its nodes are healthy before the server ends it.
infracture.execution.max-duration=${INFRACTURE_EXECUTION_MAX_DURATION:30m}
# One thread for the reconciler and one for the metrics, so a start that takes minutes does not stop the samples.
spring.task.scheduling.pool.size=2

# S3-compatible storage for images (ADR 0033). Compose shares the credentials with the server.
infracture.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
infracture.storage.access-key=${STORAGE_ACCESS_KEY:infracture}
infracture.storage.secret-key=${STORAGE_SECRET_KEY:infracture_dev}
infracture.storage.bucket=${STORAGE_BUCKET:infracture-images}
# Avatars are at most 2 MB; the request adds the multipart framing around the file.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:infracture}}
spring.datasource.username=${POSTGRES_USER:infracture}
spring.datasource.password=${POSTGRES_PASSWORD:infracture_dev}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false

# The web layer gets complete views from the services, so no request holds a database session (#92).
spring.jpa.open-in-view=false
