spring.application.name=infracture-backend
spring.config.import=optional:file:../.env[.properties]

infracture.admin.username=${INFRACTURE_ADMIN_USERNAME:}
infracture.admin.email=${INFRACTURE_ADMIN_EMAIL:}
infracture.admin.display-name=${INFRACTURE_ADMIN_DISPLAY_NAME:}
infracture.admin.password=${INFRACTURE_ADMIN_PASSWORD:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:infracture}}
spring.datasource.username=${POSTGRES_USER:infracture}
spring.datasource.password=${POSTGRES_PASSWORD:infracture_dev}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
