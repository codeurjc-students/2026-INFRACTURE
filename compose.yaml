services:
  platform-postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infracture}
      POSTGRES_USER: ${POSTGRES_USER:-infracture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracture_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # S3-compatible storage for images (avatars, covers, icons). Only the backend talks to it.
  platform-storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-infracture}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-infracture_dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9002:9001" # web console (9001 is the JMX port of the openapi build)
    volumes:
      - platform-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Only this container mounts the Docker socket; the backend reaches Docker through it
  docker-proxy:
    image: haproxy:3.2.26-alpine
    profiles: [app]
    user: root # the host socket belongs to root
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      # localhost resolves to IPv6 and the proxy listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Infracture itself. It runs experiments with the docker CLI through docker-proxy and never mounts the socket.
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: infracture/backend:0.1.0
    # Fixed name: the engine joins this container to each execution network.
    container_name: infracture-backend
    profiles: [app]
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-storage:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-postgres:5432/${POSTGRES_DB:-infracture}
      POSTGRES_USER: ${POSTGRES_USER:-infracture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracture_dev}
      STORAGE_ENDPOINT: http://platform-storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-infracture}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-infracture_dev}
      INFRACTURE_ADMIN_USERNAME: ${INFRACTURE_ADMIN_USERNAME:-}
      INFRACTURE_ADMIN_EMAIL: ${INFRACTURE_ADMIN_EMAIL:-}
      INFRACTURE_ADMIN_DISPLAY_NAME: ${INFRACTURE_ADMIN_DISPLAY_NAME:-}
      INFRACTURE_ADMIN_PASSWORD: ${INFRACTURE_ADMIN_PASSWORD:-}
      DOCKER_HOST: tcp://docker-proxy:2375
      # The CLI writes its config here; the rest of the file system is read-only.
      DOCKER_CONFIG: /tmp/docker
      INFRACTURE_EXECUTION_BACKEND_CONTAINER: infracture-backend
      # The server ends every experiment this long after all its nodes are healthy.
      INFRACTURE_EXECUTION_MAX_DURATION: ${INFRACTURE_EXECUTION_MAX_DURATION:-30m}
      # Keeps the experiments of two installations on the same Docker apart (labels and names).
      INFRACTURE_INSTANCE_ID: ${INFRACTURE_INSTANCE_ID:-local}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  platform-postgres-data:
  platform-storage-data:
