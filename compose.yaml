services:
  platform-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infracture}
      POSTGRES_USER: ${POSTGRES_USER:-infracture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracture_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  platform-postgres-data:
