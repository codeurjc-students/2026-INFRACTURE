services:
  platform-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infracture}
      POSTGRES_USER: ${POSTGRES_USER:-infracture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracture_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Only this container mounts the Docker socket; the backend reaches Docker through it
  docker-proxy:
    image: haproxy:3.2.26-alpine
    profiles: [app]
    user: root # the host socket belongs to root
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      # localhost resolves to IPv6 and the proxy listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Infracture itself. It runs experiments with the docker CLI through docker-proxy and never mounts the socket.
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: infracture/backend:0.1.0
    # Fixed name: the engine joins this container to each execution network.
    container_name: infracture-backend
    profiles: [app]
    depends_on:
      platform-postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://platform-postgres:5432/${POSTGRES_DB:-infracture}
      POSTGRES_USER: ${POSTGRES_USER:-infracture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracture_dev}
      INFRACTURE_ADMIN_USERNAME: ${INFRACTURE_ADMIN_USERNAME:-}
      INFRACTURE_ADMIN_EMAIL: ${INFRACTURE_ADMIN_EMAIL:-}
      INFRACTURE_ADMIN_DISPLAY_NAME: ${INFRACTURE_ADMIN_DISPLAY_NAME:-}
      INFRACTURE_ADMIN_PASSWORD: ${INFRACTURE_ADMIN_PASSWORD:-}
      DOCKER_HOST: tcp://docker-proxy:2375
      # The CLI writes its config here; the rest of the file system is read-only.
      DOCKER_CONFIG: /tmp/docker
      INFRACTURE_EXECUTION_BACKEND_CONTAINER: infracture-backend
      # Keeps the experiments of two installations on the same Docker apart (labels and names).
      INFRACTURE_INSTANCE_ID: ${INFRACTURE_INSTANCE_ID:-local}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  platform-postgres-data:
