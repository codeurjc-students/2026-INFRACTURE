spring.application.name=infracture-demo-app
spring.main.banner-mode=off
server.port=8080

# The delay sleeps per request; virtual threads keep that wait cheap under load.
spring.threads.virtual.enabled=true

# Health at /health and Prometheus counters at /metrics. Health lists each dependency, so a running
# process with a broken connection reports DOWN.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoint.health.show-components=always

# Errors of the controlled API answer as application/problem+json.
spring.mvc.problemdetails.enabled=true

# Only DATABASE_CRUD has a database, and it creates its own data source from DATABASE_URL (DatabaseConfiguration).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
